name: stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/stats.mjs', '.github/workflows/stats.yml']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render stats card
        run: |
          mkdir -p out
          node .github/scripts/stats.mjs > out/stats.svg
      - name: Publish to the stats branch
        working-directory: out
        run: |
          git init -q -b stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.svg
          git commit -q -m 'chore: update stats card'
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" stats
